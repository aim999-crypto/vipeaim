
name: Daily Tech Telegram Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 4 * * *"
    - cron: "0 6 * * *"
    - cron: "0 8 * * *"
    - cron: "0 10 * * *"
    - cron: "0 12 * * *"
    - cron: "0 14 * * *"
    - cron: "0 16 * * *"
    - cron: "0 18 * * *"
    - cron: "0 20 * * *"

permissions:
  contents: write

concurrency:
  group: vipeaim-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Publish Telegram post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Save duplicate history
        run: |
          git config user.name "daily-tech-bot"
          git config user.email "daily-tech-bot@users.noreply.github.com"

          git add state.json posts.json analytics.json publication_log.csv

          if git diff --cached --quiet; then
            echo "No history changes"
            exit 0
          fi

          git commit -m "Update published article history"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
